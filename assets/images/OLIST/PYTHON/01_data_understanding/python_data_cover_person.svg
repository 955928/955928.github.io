<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="55%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <radialGradient id="warmGlow3" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#e08a35" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e08a35" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e08a35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1526" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <rect width="1600" height="900" fill="url(#warmGlow3)"/>

  <g font-family="Consolas, monospace" font-size="15" fill="#3a4a63" opacity="0.55">
    <text x="55" y="215">df.head()</text>
    <text x="55" y="800">what does this column mean?</text>
    <text x="1230" y="195">df.info()</text>
    <text x="1220" y="805"># still confused...</text>
  </g>
  <g fill="#2c3a52" opacity="0.5">
    <rect x="40" y="700" width="18" height="140"/>
    <rect x="70" y="740" width="18" height="100"/>
    <rect x="1500" y="720" width="18" height="120"/>
    <rect x="1530" y="760" width="18" height="80"/>
  </g>

  <!-- title, same layout as reference -->
  <text x="800" y="115" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="62" font-weight="900" fill="#ffffff" filter="url(#softGlow3)">
    Understanding My Data
  </text>
  <line x1="640" y1="150" x2="960" y2="150" stroke="#e0a52e" stroke-width="2"/>
  <circle cx="640" cy="150" r="5" fill="#4fc3f7"/>
  <circle cx="960" cy="150" r="5" fill="#e0a52e"/>
  <text x="800" y="182" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="6"
        font-size="20" fill="#9fb0c9">ONE CONFUSING COLUMN AT A TIME</text>

  <!-- main window, same chrome as reference -->
  <g transform="translate(340,240)">
    <rect x="0" y="0" width="920" height="540" rx="14" fill="url(#panel3)" stroke="#4fc3f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="14" fill="#0f1a2e"/>
    <rect x="0" y="30" width="920" height="16" fill="#0f1a2e"/>
    <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="23" r="6" fill="#febc2e"/>
    <circle cx="70" cy="23" r="6" fill="#28c840"/>
    <text x="100" y="29" font-family="Consolas, monospace" font-size="16" fill="#cfd8e6">exploring_data.py</text>
    <text x="850" y="29" font-family="Consolas, monospace" font-size="14" fill="#e0a52e">THINKING</text>

    <!-- desk -->
    <rect x="120" y="420" width="680" height="16" fill="#1a2740"/>
    <rect x="150" y="436" width="16" height="70" fill="#14203a"/>
    <rect x="754" y="436" width="16" height="70" fill="#14203a"/>

    <!-- screen on desk -->
    <g transform="translate(430,270)">
      <rect x="-140" y="-100" width="280" height="170" rx="6" fill="#0a1428" stroke="#4fc3f7" stroke-width="2"/>
      <rect x="-130" y="-90" width="260" height="150" fill="url(#screenGlow)"/>
      <!-- messy chart data on screen, unresolved -->
      <polyline points="-115,20 -85,-10 -55,15 -25,-40 5,5 35,-55 65,-10 95,-70"
                fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
      <g fill="#ffe27a" opacity="0.9">
        <rect x="-120" y="35" width="14" height="20"/>
        <rect x="-95" y="10" width="14" height="45"/>
        <rect x="-70" y="40" width="14" height="15"/>
        <rect x="-45" y="-5" width="14" height="60"/>
        <rect x="-20" y="20" width="14" height="35"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#7fb9e6">???</text>
      <!-- monitor stand -->
      <rect x="-15" y="70" width="30" height="18" fill="#1a2740"/>
      <rect x="-45" y="88" width="90" height="8" rx="3" fill="#1a2740"/>
    </g>

    <!-- person silhouette sitting at desk, chin on hand, puzzled -->
    <g transform="translate(430,395)">
      <!-- chair -->
      <rect x="-38" y="20" width="76" height="10" rx="4" fill="#1a2740"/>
      <!-- torso -->
      <path d="M -55 15 C -55 -35 55 -35 55 15 L 55 40 L -55 40 Z" fill="#132038"/>
      <!-- head -->
      <circle cx="0" cy="-60" r="30" fill="#17253f"/>
      <!-- arm to chin, thinking pose -->
      <path d="M 38 -5 C 55 -20 45 -45 20 -50" stroke="#132038" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- other arm resting -->
      <path d="M -40 0 C -55 15 -50 30 -35 35" stroke="#132038" stroke-width="16" fill="none" stroke-linecap="round"/>
    </g>

    <!-- thought bubble with question marks above head -->
    <g transform="translate(500,215)" filter="url(#softGlow3)">
      <circle cx="0" cy="30" r="6" fill="#0f1a2e" stroke="#4fc3f7" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="9" fill="#0f1a2e" stroke="#4fc3f7" stroke-width="1.5"/>
      <ellipse cx="55" cy="-15" rx="55" ry="42" fill="#0f1a2e" stroke="#4fc3f7" stroke-width="1.5"/>
      <text x="55" y="-2" text-anchor="middle" font-family="Arial" font-weight="700" font-size="30" fill="#ffe27a">?</text>
      <text x="30" y="-22" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#4fc3f7">?</text>
      <text x="80" y="-25" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#4fc3f7">?</text>
    </g>

    <!-- sticky notes / clues pinned beside screen -->
    <g font-family="Consolas, monospace" font-size="12" fill="#0a1428">
      <g transform="translate(650,190) rotate(6)">
        <rect x="-40" y="-18" width="80" height="55" fill="#ffe27a"/>
        <text x="-32" y="0" fill="#0a1428">null values?</text>
        <text x="-32" y="16" fill="#0a1428">check dtype</text>
      </g>
      <g transform="translate(720,300) rotate(-5)">
        <rect x="-40" y="-18" width="80" height="55" fill="#4fc3f7"/>
        <text x="-32" y="0" fill="#0a1428">merge keys</text>
        <text x="-32" y="16" fill="#0a1428">don't match</text>
      </g>
      <g transform="translate(180,190) rotate(-6)">
        <rect x="-40" y="-18" width="80" height="55" fill="#e0a52e"/>
        <text x="-32" y="0" fill="#0a1428">date format</text>
        <text x="-32" y="16" fill="#0a1428">is off</text>
      </g>
    </g>

    <!-- magnifying glass over a small data table, bottom left of window -->
    <g transform="translate(220,470)">
      <g font-family="Consolas, monospace" font-size="11" fill="#7fb9e6">
        <text x="-40" y="-30">id   value</text>
        <text x="-40" y="-14">101  NaN</text>
        <text x="-40" y="2">102  84.2</text>
        <text x="-40" y="18">103  NaN</text>
      </g>
      <circle cx="10" cy="-6" r="24" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
      <line x1="27" y1="12" x2="45" y2="30" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <text x="800" y="850" text-anchor="middle" font-family="Consolas, monospace" font-size="15"
        fill="#5d6f8c" letter-spacing="2">PYTHON · PANDAS · MAKING SENSE OF THE MESS</text>
</svg>
